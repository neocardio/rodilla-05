;margin-top:20px}.metric{display:flex;align-items:center;gap:18px;margin-top:27px}.metric b{font-size:52px;font-weight:300;color:var(--lav)}.metric span{font-size:12px;max-width:140px;color:var(--muted)}.notice{border:1px solid #3e675d;border-radius:14px;background:#1c37362b;padding:16px 18px;margin:0 0 20px;font-size:13px;color:var(--text)}.notice p{margin:6px 0 10px}.warning{border-color:#876646;background:#5d392429}.page-heading{padding:20px 0 32px}.page-heading h1{font-size:48px}.phase-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.phase-number{font-size:36px;line-height:1;color:var(--muted);display:block;margin-bottom:17px}.phase.current{border-color:var(--mint)}.phase.current .phase-number{color:var(--mint)}.phase p{font-size:14px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{border:1px solid var(--line);border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;text-align:center}.week b{color:var(--mint)}.week span{font-size:9px;color:var(--muted)}details{border-bottom:1px solid var(--line);padding:16px 0}summary{cursor:pointer;font-weight:550}summary span{display:block;font-size:11px;color:var(--muted);font-weight:400}details p{font-size:14px}.chart{width:100%;display:block}.chart text{fill:var(--muted);font-size:10px}.empty{padding:35px 10px;text-align:center;color:var(--muted);font-size:14px}.log{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}.log strong{font-size:14px}.log p{font-size:12px;margin:5px 0}.log button{flex-shrink:0}label{display:block;margin:18px 0;font-size:13px;color:var(--muted)}input:not([type=checkbox]):not([type=range]),textarea{background:#0c1523;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);width:100%;margin-top:8px}input[type=range]{display:block;width:100%;accent-color:var(--mint);margin:15px 0}input[type=checkbox]{accent-color:var(--mint);width:18px;height:18px;flex-shrink:0}.check{display:flex;align-items:flex-start;gap:10px;color:var(--text);font-size:13px}.check input{margin-top:3px}ul{padding-left:20px;color:var(--muted);font-size:14px}li{margin:12px 0}.source-links{display:flex;flex-direction:column;gap:12px;font-size:13px}a{color:var(--mint);text-underline-offset:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.danger-text{color:var(--amber)}nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0c1523f0;border-top:1px solid var(--line);backdrop-filter:blur(18px);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}nav button{width:130px;border-radius:12px;background:transparent;color:var(--muted);font-size:11px;padding:8px}nav button b{display:block;font-size:19px;font-weight:400;line-height:1.2;margin-bottom:5px}nav button.selected{background:#203b37;color:var(--mint)}footer{max-width:1100px;margin:0 auto 110px;font-size:10px;color:var(--muted);padding:0 30px}dialog{color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:520px;width:calc(100% - 32px);max-height:90dvh;overflow:auto}dialog::backdrop{background:#030915c9;backdrop-filter:blur(5px)}.close-row{text-align:right}#close-modal{border-radius:50%;width:32px;height:32px;padding:0;color:var(--muted);background:#27364a;font-size:20px}.workout{max-width:760px;margin:12px auto;text-align:center}.workout h1{font-size:40px;letter-spacing:-1.5px}.instruction{font-size:17px;margin:22px auto;max-width:560px}.exercise-art{width:100%;max-width:350px;height:180px;stroke:var(--mint);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.exercise-art .surface{stroke:var(--line);stroke-width:3}.exercise-art .ghost{stroke:var(--muted);opacity:.25;stroke-dasharray:6 6}.pulse{stroke:var(--lav);stroke-width:2;animation:pulse 2s infinite}.moving{transform-origin:130px 85px;animation:move 3s infinite alternate}.timer{font-size:66px;color:var(--mint);font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-3px;margin-top:10px}.center{justify-content:center}.progress-track{height:4px;background:var(--line);border-radius:6px;margin-top:20px;overflow:hidden}.progress-track span{display:block;height:100%;background:var(--mint)}#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,15px);width:max-content;max-width:calc(100% - 30px);background:#30483f;color:#edf9f2;border:1px solid #568775;border-radius:14px;padding:14px 20px;z-index:100;font-size:13px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{opacity:.3}}@keyframes move{to{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:700px){header{padding:20px}.stage{font-size:8px;max-width:165px}main{padding:15px 20px 100px}.hero{grid-template-columns:1fr;padding:18px 0 30px}.hero-art{display:none}h1{font-size:43px;letter-spacing:-2px}.dashboard{grid-template-columns:1fr;gap:16px}.card{padding:22px;border-radius:18px}.quote h2{font-size:24px}.phase-grid{grid-template-columns:1fr}.page-heading h1{font-size:39px}.mini-stats{gap:25px}.log{align-items:flex-start;flex-wrap:wrap}.week{gap:4px}.week span{font-size:8px}.week div{padding:10px 2px}nav{gap:3px;padding-left:8px;padding-right:8px}nav button{width:25%;max-width:120px}.workout h1{font-size:32px}.instruction{font-size:15px}.section-head{flex-wrap:wrap}.brand{font-size:18px}.metric{margin-top:20px}}
</style></head><body><header><div class="brand">RODILLA <span>05</span><small>TU CITA CONTIGO</small></div><div class="stage" id="stage-label"></div></header><main><div id="view"></div></main><footer>Rodilla 05 · Apoyo a una recuperación supervisada. Versión 1.0 · Sin seguimiento de terceros.</footer><nav aria-label="Navegación principal"><button data-tab="today" class="selected"><b aria-hidden="true">◉</b>Hoy</button><button data-tab="progress"><b aria-hidden="true">↗</b>Progreso</button><button data-tab="plan"><b aria-hidden="true">▤</b>Mi plan</button><button data-tab="care"><b aria-hidden="true">＋</b>Mi revisión</button></nav><dialog id="modal"><div class="close-row"><button id="close-modal" aria-label="Cerrar">×</button></div><div id="modal-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div><noscript>Activa JavaScript para usar las rutinas y guardar tu registro.</noscript><script>(function(root){
  const day=(date=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
  function screen(s){
    if(s.cold||s.calf||s.fever) return {level:'urgent',text:'No entrenes. Pie frío o adormecido, pantorrilla hinchada/dolorosa, o fiebre con rodilla roja requieren atención urgente. Si hay falta de aire o dolor torácico, llama al 911.'};
    if(s.lock||s.unstable||s.noWeight||s.largeSwelling) return {level:'stop',text:'Pausa la sesión y solicita valoración pronta: bloqueo, nueva inestabilidad, incapacidad de apoyo o derrame importante necesitan exploración.'};
    if(s.pain>2||s.swelling>0||s.limp) return {level:'adapt',text:'Hoy reduce la carga. Solo movilidad suave sin dolor; gimnasio de rodilla suspendido. Si empeora o persiste, consulta.'};
    return {level:'go',text:'Puedes probar la sesión conservadora. Detente ante dolor mayor de 2/10, pinchazo, bloqueo o sensación de desplazamiento.'};
  }
  function canAdvance(state){
    if(!state.clearance||!state.clearance.reviewed||!state.clearance.approved) return {ok:false,reason:'Pendiente revisar el estudio y confirmar con tu tratante que este plan y sus ejercicios son adecuados.'};
    if(state.phase>=3) return {ok:false,reason:'Última etapa disponible. El retorno a impacto necesita valoración funcional presencial.'};
    const sessions=state.sessions.filter(s=>s.phase===state.phase).sort((a,b)=>b.started.localeCompare(a.started));
    const recent=sessions.slice(0,3);
    if(recent.length<3) return {ok:false,reason:'Registra tres sesiones en días distintos y revisa la respuesta al día siguiente.'};
    if(new Set(recent.map(x=>x.day)).size<3) return {ok:false,reason:'Las tres sesiones deben ser de días distintos.'};
    if(recent.some(x=>x.skipped||x.stopped||x.pre?.level!=='go'||!x.post||x.post.pain>2||x.post.pain>x.pre.pain||x.post.swelling||x.post.unstable||!x.next||x.next.pain>2||x.next.pain>x.pre.pain||x.next.worse||x.next.swelling||x.next.unstable)) return {ok:false,reason:'Se requieren tres sesiones recientes completas de esta etapa, sin aumento de síntomas, con revisión de las 24 horas.'};
    return {ok:true,reason:'Cumples el filtro conservador de tolerancia. Avanza solo si tu tratante autorizó esta etapa; esto no mide cicatrización.'};
  }
  const ex=(id,name,dose,seconds,how,stop)=>({id,name,dose,seconds,how,stop});
  function routine(phase,place,adapt=false){
    const ankle=ex('ankle','Despierta el tobillo','20 repeticiones suaves',50,'Sentado o acostado, alterna la punta del pie hacia ti y hacia delante. La rodilla descansa.','Sin dolor de pantorrilla ni cambios de sensibilidad.');
    const slide=ex('slide','Desliza el talón','1 × 10 repeticiones',90,'Acostado boca arriba, desliza el talón para doblar y estirar dentro del rango cómodo. No fuerces el final ni uses tirones.','Suspende si hay enganche, bloqueo o dolor punzante.');
    const quad=ex('quad','Activa el cuádriceps',phase===0?'10 × 5 segundos':'2 × 10 contracciones de 5 segundos',phase===0?90:180,'Con la pierna apoyada y estirada, aprieta suavemente el muslo y lleva la parte posterior de la rodilla hacia la cama. Respira y relaja entre contracciones.','No fuerces una rodilla que no puede extenderse.');
    if(adapt) return [ankle,ex('slide','Movilidad cómoda','Hasta 5 repeticiones, sin forzar',60,slide.how,'Omite este movimiento si duele, se engancha o existe una restricción médica.')];
    if(place==='gym'){
      const upper=[ex('seated','Press de pecho sentado','2 × 10–12 · esfuerzo 4/10',180,'Máquina con respaldo, carga ligera, pies cómodos y sin empujar con las piernas. Descansa 60–90 segundos entre series.','Evita esfuerzo máximo, aguantar la respiración o traslado inseguro al aparato.'),ex('row','Remo con apoyo','2 × 10–12 · esfuerzo 4/10',180,'Sentado con tronco apoyado si hay máquina disponible. Tira con los brazos; no uses impulso de piernas.','Si la postura exige doblar mucho la rodilla o causa dolor, omite.'),ex('arms','Bíceps sentado','2 × 10–12 · esfuerzo 4/10',180,'Usa mancuernas ligeras, respaldo y movimiento lento. No cargues pesos caminando.','Pide ayuda para mover material y evita apoyos inestables.')];
      if(phase<2) return upper;
      return [ex('bike','Bicicleta suave',phase===2?'5 minutos sin resistencia':'8 minutos · resistencia mínima',phase===2?300:480,'Solo autorizada por tu tratante: asiento alto, flexión cómoda y pedaleo fluido. No fuerces una vuelta completa si el rango no alcanza.','Omite si no puedes pedalear sin dolor, derrame o inestabilidad.'),...upper,ex('sit','Sentarse y levantarse',phase===2?'1 × 8 · silla alta':'2 × 8 · silla alta',phase===2?120:240,'Solo autorizado: silla firme alta, apoyo cercano, pies al ancho de cadera. Levántate lentamente sin que la rodilla caiga hacia dentro. Sin peso adicional.','No hagas flexión profunda. Detente ante dolor o falla.'),ex('calf','Talones con apoyo',phase===2?'1 × 10 · ambos pies':'2 × 10 · ambos pies',phase===2?90:180,'De pie frente a una superficie firme, sube ambos talones despacio y baja con control. Mantén apoyo de manos.','Solo si apoyas sin cojera y el ejercicio está autorizado.')];
    }
    if(phase===0) return [ankle,slide,quad];
    return [ankle,slide,quad,ex('raise','Pierna recta',phase===1?'1 × 8':'2 × 8',phase===1?90:180,'Acostado, contrae el muslo y eleva unos 20 cm. Solo si puedes mantener la rodilla totalmente recta, sin que se doble al elevar.','Omite si no mantienes extensión, duele o hay restricción médica.'),ex('hip','Cadera de lado',phase===1?'1 × 10':'2 × 10',phase===1?90:180,'Acostado sobre el lado derecho, eleva suavemente la pierna izquierda recta, sin girar la pelvis; baja lentamente.','Sin peso ni banda. Evita movimientos que provoquen dolor de rodilla.')];
  }
  const api={day,screen,canAdvance,routine};
  if(typeof module!=='undefined') module.exports=api;
  root.RehabCore=api;
})(typeof globalThis!=='undefined'?globalThis:this);
</script><script>const $=s=>document.querySelector(s), C=RehabCore, KEY='rodilla05:v1';
const monarchTheme=document.querySelector('link[href="./monarch.css"]');
if(monarchTheme)document.head.append(monarchTheme);
const brandLine=document.querySelector('.brand small');
if(brandLine)brandLine.textContent='MODO OSO MONARCA';
const blank=()=>({version:1,phase:0,place:'home',sessions:[],clearance:null,mriDate:'2026-10-07',notes:'',goal:'Caminar con confianza y volver a mis actividades.'});
let state=blank(), storageOK=true, active=null, interval=null, remaining=0, tab='today', installEvent;
try{state={...blank(),...JSON.parse(localStorage.getItem(KEY)||'{}')};if(!Array.isArray(state.sessions)||![0,1,2,3].includes(state.phase))state=blank();}catch(e){storageOK=false;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['Proteger y mover','Activar con control','Recuperar fuerza','Consolidar'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;toast('No se pudo guardar. Exporta tu registro antes de cerrar.');}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),4500);}
function nav(t){if(active){toast('Termina o detén la sesión antes de cambiar de vista.');return;}tab=t;render();}
function monarchStreak(){
 const days=[...new Set(state.sessions.filter(s=>!s.stopped).map(s=>s.day))].sort().reverse();
 if(!days.length)return 0;
 let cursor=new Date(`${C.day()}T12:00:00`),count=0;
 const latest=new Date(`${days[0]}T12:00:00`);
 if(Math.round((cursor-latest)/86400000)>1)return 0;
 cursor=latest;
 for(const d of days){const current=new Date(`${d}T12:00:00`);if(Math.round((cursor-current)/86400000)>1)break;count++;cursor=current;}
 return count;
}
function monarchVoice(){
 const streak=monarchStreak();
 if(streak>=7)return 'Siete amaneceres cuidando tu paso. Eso ya es carácter de Monarca.';
 if(streak>=3)return 'La fuerza no siempre ruge: a veces aparece a las 05:00 y cumple con calma.';
 if(state.sessions.length)return 'Ya comenzaste. Hoy no necesitas demostrar nada: solo sumar un movimiento bien hecho.';
 return 'Todo regreso empieza con un paso pequeño. Hoy despertamos al Oso, sin despertar el dolor.';
}
function bearCrest(){return `<svg class="bear-crest" viewBox="0 0 260 260" role="img" aria-label="Emblema Oso Monarca"><defs><linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7bd48"/><stop offset="1" stop-color="#ee6f32"/></linearGradient></defs><path class="crown" d="M77 62l18 12 35-38 35 38 18-12-8 43H85z"/><circle class="halo" cx="130" cy="145" r="92"/><circle class="ear" cx="73" cy="117" r="28"/><circle class="ear" cx="187" cy="117" r="28"/><path class="face" d="M65 139c0-57 33-82 65-82s65 25 65 82c0 53-31 82-65 82s-65-29-65-82z"/><path class="muzzle" d="M91 158c0-25 18-42 39-42s39 17 39 42-18 43-39 43-39-18-39-43z"/><circle class="eye" cx="104" cy="132" r="6"/><circle class="eye" cx="156" cy="132" r="6"/><path class="nose" d="M119 155q11-8 22 0l-3 10h-16z"/><path class="smile" d="M130 165v10m0 0q-13 11-23 0m23 0q13 11 23 0"/><text x="130" y="246">OSO MONARCA</text></svg>`;}
function render(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('selected',b.dataset.tab===tab));
  $('#stage-label').textContent=`ETAPA ${state.phase} · ${names[state.phase]}`;
  $('#view').innerHTML=tab==='today'?today():tab==='progress'?progress():tab==='plan'?plan():care();
  wire();
}
function recentDue(){return state.sessions.filter(s=>!s.next&&s.day<C.day());}
function today(){
 const due=recentDue();const count=new Set(state.sessions.filter(s=>!s.stopped).map(s=>s.day)).size;const streak=monarchStreak();
 return `<section class="hero"><div><span class="eyebrow">MODO OSO MONARCA · 05:00</span><h1>Despierta tu fuerza.<br><em>Cuida cada paso.</em></h1><p>Rodilla izquierda · rehabilitación progresiva con cabeza, constancia y corazón.</p><span class="pill">${state.phase===0?'Antes de conocer la lesión: dosis mínima':'Plan sujeto a las indicaciones de tu tratante'}</span></div><div class="hero-art"><div class="orbit"></div>${bearCrest()}<div class="time-medal">05:00</div><div class="art-label">FUERZA CON CONTROL</div></div></section>
 ${!storageOK?'<div class="notice warning">El navegador no permite guardar. Exporta tu registro al terminar.</div>':''}
 ${due.length?`<div class="notice"><strong>Falta revisar la respuesta de las 24 horas.</strong><p>Registrar cómo amaneciste vale tanto como hacer la sesión.</p><button class="small" id="due">Revisar ${due.length} sesión(es)</button></div>`:''}
 <section class="monarch-callout"><div class="mini-bear">${bearCrest()}</div><div><span class="eyebrow">MENSAJE DEL OSO</span><h2>${esc(monarchVoice())}</h2><p>La meta no es aguantar dolor. La meta es recuperar confianza y función.</p></div><div class="streak-medal"><b>${streak}</b><span>${streak===1?'día seguido':'días seguidos'}</span></div></section>
 <div class="dashboard"><section class="card"><div class="section-head"><h2>Tu misión de hoy</h2><span class="dot"></span></div><div class="segmented"><button id="home" class="${state.place==='home'?'on':''}">En casa · 05:00</button><button id="gym" class="${state.place==='gym'?'on':''}">Gimnasio</button></div><p class="muted">${state.place==='home'?'Movilidad y activación suaves. Ten una cama firme o colchoneta y una toalla.':state.phase<2?'Tren superior sentado. Por ahora, la rodilla no lleva carga de gimnasio.':'Fuerza suave autorizada. Deja al menos 48 horas entre sesiones de fuerza de rodilla.'}</p><div class="mini-stats"><div><b>${C.routine(state.phase,state.place).length}</b><span>movimientos</span></div><div><b>${Math.ceil(C.routine(state.phase,state.place).reduce((a,x)=>a+x.seconds,0)/60)}</b><span>minutos aprox.</span></div><div><b>${state.phase===0?'Suave':'Control'}</b><span>tu misión</span></div></div><button class="primary" id="start">Activar modo Monarca <span>→</span></button><p class="fine">El temporizador orienta el ritmo; manda la técnica y la dosis indicada.</p></section><aside class="card quote"><span class="eyebrow">VOLVER A LO QUE TE IMPORTA</span><h2>Tu agenda también necesita una rodilla que te acompañe.</h2><p>${esc(state.goal)}</p><div class="metric"><b>${count}</b><span>días de cuidado registrados</span></div><p class="fine">El Oso inteligente también sabe bajar el paso. Descansar y adaptar cuentan.</p></aside></div>
 <section class="card"><div class="section-head"><h2>El siguiente hito</h2><span class="pill">${esc(state.mriDate)}</span></div><p>Resonancia y revisión clínica. El resultado por sí solo no autoriza subir la intensidad.</p><button class="text" id="care-link">Preparar mi revisión →</button></section>`;
}
function progress(){
 const advance=C.canAdvance(state);
 return `<div class="page-heading"><span class="eyebrow">LO QUE MEJORA, SE OBSERVA</span><h1>Tu progreso real.</h1><p>El dolor y la función importan más que completar una racha.</p></div><div class="dashboard"><section class="card"><h2>Respuesta después de entrenar</h2>${chart()}<p class="fine">Dolor 0–10. Cada punto es una sesión, no una medición de cicatrización.</p></section><section class="card"><h2>¿Subir un escalón?</h2><p>${esc(advance.reason)}</p><button class="primary" id="advance" ${advance.ok?'':'disabled'}>Revisar avance de etapa →</button><button class="text" id="back" ${state.phase===0?'disabled':''}>Reducir una etapa</button><p class="fine">Tres días estables es un filtro conservador de esta app, no un umbral clínico validado.</p></section></div><section class="card"><div class="section-head"><h2>Bitácora</h2><button class="small" id="export">Exportar registro</button></div>${state.sessions.length?state.sessions.slice().reverse().map(s=>`<article class="log"><div><strong>${esc(s.day)} · ${s.place==='home'?'Casa':'Gimnasio'}</strong><p>Etapa ${s.phase} · ${s.stopped?'Detenida':s.skipped?'Adaptada':'Completada'} · dolor final ${s.post?.pain??'—'}/10</p><p class="fine">${s.next?`Revisión posterior: ${esc(s.next.day)} · dolor ${s.next.pain}/10 · ${s.next.worse||s.next.swelling||s.next.unstable?'síntomas aumentaron o persisten':'sin aumento de síntomas'}`:'Respuesta de las 24 horas pendiente'}</p></div>${!s.next&&s.day<C.day()?`<button class="small" data-follow="${esc(s.id)}">Cómo amanecí</button>`:''}</article>`).join(''):'<div class="empty">Tu primera sesión abrirá esta bitácora. Cinco minutos de cuidado ya son un comienzo.</div>'}</section>`;
}
function chart(){
 const arr=state.sessions.filter(s=>s.post).slice(-12);if(!arr.length)return '<div class="empty">Aquí verás tu tendencia después de registrar sesiones.</div>';
 const points=arr.map((s,i)=>`${30+i*460/Math.max(1,arr.length-1)},${170-s.post.pain*14}`).join(' ');
 return `<svg class="chart" viewBox="0 0 530 210" role="img" aria-label="Evolución del dolor al terminar cada sesión, de cero a diez"><path d="M30 30V170H500" fill="none" stroke="#526174"/><path d="M30 142H500" stroke="#91e0c4" stroke-dasharray="4 5"/><text x="4" y="34">10</text><text x="10" y="174">0</text><text x="475" y="136">2</text><polyline points="${points}" fill="none" stroke="#91e0c4" stroke-width="3"/>${arr.map((s,i)=>`<circle cx="${30+i*460/Math.max(1,arr.length-1)}" cy="${170-s.post.pain*14}" r="5" fill="#b7a3ef"><title>${esc(s.day)}: ${s.post.pain}/10</title></circle>`).join('')}<text x="30" y="199">${esc(arr[0].day)}</text><text x="412" y="199">${esc(arr.at(-1).day)}</text></svg>`;
}
function plan(){return `<div class="page-heading"><span class="eyebrow">PROGRESAR CON CRITERIO</span><h1>Cuatro etapas.<br>Tu rodilla marca el ritmo.</h1><p>Sin fechas automáticas, sin cargas máximas y sin retorno al impacto desde esta app.</p></div><div class="phase-grid">${names.map((n,i)=>`<section class="card phase ${state.phase===i?'current':''}"><span class="phase-number">0${i}</span><h2>${n}</h2><p>${['Antes del estudio: tobillo, movilidad cómoda y contracciones suaves. No se presupone lesión de menisco ni de rótula.','Después de revisión y autorización: añadir pierna recta y cadera sin peso, si están permitidas.','Tras tolerancia y autorización de esta etapa: bicicleta sin resistencia y fuerza funcional ligera.','Aumentar primero duración o una serie. El peso y ejercicios adicionales los define tu fisioterapeuta.'][i]}</p><span class="pill">${state.phase===i?'Etapa actual':i>state.phase?'Pendiente de criterios':'Etapa anterior'}</span></section>`).join('')}</div><section class="card"><h2>Una semana que sí cabe</h2><div class="week">${['L','M','M','J','V','S','D'].map((d,i)=>`<div><b>${d}</b><span>${[1,3,5].includes(i)?'Gimnasio':'Casa suave'}</span></div>`).join('')}</div><p>Casa a las 05:00. Gimnasio sugerido martes, jueves y sábado. En días de gimnasio con fuerza de rodilla, en casa solo movilidad suave: no dupliques fortalecimiento.</p><p class="fine">Si tu tratante limita apoyo, movimiento o ejercicio, sus indicaciones sustituyen esta propuesta.</p></section><section class="card"><h2>Biblioteca de tu etapa</h2>${C.routine(state.phase,state.place).map(x=>`<details><summary>${esc(x.name)} <span>${esc(x.dose)}</span></summary><p>${esc(x.how)}</p><p class="fine">${esc(x.stop)}</p></details>`).join('')}</section>`;}
function care(){return `<div class="page-heading"><span class="eyebrow">RESONANCIA + EXPLORACIÓN + PLAN</span><h1>El diagnóstico<br>afina el camino.</h1><p>Una app acompaña tu recuperación; no identifica la lesión ni decide cirugía.</p></div><div class="dashboard"><section class="card"><h2>Mi revisión clínica</h2><form id="clinical"><label>Fecha de resonancia<input type="date" name="mriDate" value="${esc(state.mriDate)}" required></label><label>Mi objetivo<input name="goal" maxlength="180" value="${esc(state.goal)}"></label><label>Indicaciones o restricciones de mi tratante<textarea name="notes" rows="4" maxlength="4000" placeholder="Apoyo permitido, flexión máxima, rodillera, ejercicios autorizados…">${esc(state.notes)}</textarea></label><label class="check"><input type="checkbox" name="reviewed" ${state.clearance?.reviewed?'checked':''}> Mi estudio y exploración ya fueron revisados por mi tratante.</label><label class="check"><input type="checkbox" name="approved" ${state.clearance?.approved?'checked':''}> Mi tratante autorizó los ejercicios de la siguiente etapa. No tengo restricciones incompatibles.</label><button class="primary" type="submit">Guardar indicaciones</button></form><p class="fine">Estas casillas registran una indicación recibida; no la sustituyen. Si el plan no coincide con tus restricciones, pausa y solicita que se adapte.</p></section><section class="card"><h2>Para llevar a la consulta</h2><ul><li>¿Es inestabilidad rotuliana, lesión meniscal, ligamentaria u osteocondral?</li><li>¿Cuánto apoyo y flexión puedo hacer?</li><li>¿Necesito rodillera o ayudas para caminar?</li><li>¿Qué ejercicios de esta app están permitidos y cuáles debo omitir?</li><li>¿Qué hallazgos requieren otra intervención y cuándo reevaluar?</li></ul><div class="notice warning"><b>Detener y valorar</b><p>Bloqueo, nueva falla, incapacidad de apoyo o derrame importante: valoración pronta. Pie frío/adormecido, fiebre con rodilla roja o pantorrilla hinchada y dolorosa: urgente. Falta de aire o dolor torácico: 911.</p></div></section></div><section class="card"><h2>Evidencia y límites</h2><p>Movilidad progresiva, recuperación del cuádriceps y control de cadera son componentes habituales de rehabilitación. La dosis inicial aquí es conservadora; no es un protocolo validado para una lesión aún no diagnosticada. La guía de menisco agudo aislado no se extrapola a lesiones combinadas, de raíz o degenerativas.</p><div class="source-links"><a href="https://www.aaos.org/quality/quality-programs/acute-isolated-meniscal-pathology/" target="_blank" rel="noopener">AAOS · guía de menisco agudo, 2024 ↗</a><a href="https://www.hey.nhs.uk/patient-leaflet/patella-dislocation-advice-regarding-healing-and-recovery/" target="_blank" rel="noopener">NHS Hull · rehabilitación rotuliana, 2026 ↗</a><a href="https://orthoinfo.aaos.org/diseases--conditions/unstable-kneecap/" target="_blank" rel="noopener">AAOS · inestabilidad rotuliana ↗</a></div><p>Regla operativa: dolor hasta 2/10, sin pinchazo, bloqueo, falla ni deterioro a las 24 horas. Si empeoras, reduce o pausa. Los filtros y etapas de la app son decisiones conservadoras de diseño, no pruebas de recuperación estructural.</p></section><section class="card"><h2>Tu registro es tuyo</h2><p>Se guarda únicamente en este navegador, sin cuentas ni envío de síntomas a un servidor. No se sincroniza entre dispositivos. Borrar los datos del navegador elimina la bitácora; exporta una copia periódica. El código de la app es público; tu registro no se publica.</p><div class="actions"><button class="small" id="export">Exportar copia</button><button class="small" id="import">Restaurar copia</button><button class="small" id="install">Instalar en mi celular</button><button class="small" id="calendar">Llevar las 05:00 al calendario</button><button class="small danger-text" id="reset">Borrar mi registro</button></div><input type="file" id="import-file" accept="application/json,.json" hidden><p class="fine">La app no genera alarmas mientras está cerrada. Usa la alarma del teléfono o importa el recordatorio al calendario.</p></section>`;}
function openModal(html){$('#modal-body').innerHTML=html;$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function checkboxes(){return [['swelling','Tengo algo de hinchazón'],['limp','Estoy cojeando'],['lock','Se traba o no puedo estirarla'],['unstable','Falló o volvió a desplazarse'],['noWeight','No puedo apoyar'],['largeSwelling','La hinchazón es importante o aumentó rápido'],['cold','Pie frío, adormecido o con cambio de color'],['calf','Pantorrilla hinchada y dolorosa'],['fever','Fiebre y rodilla roja/caliente']].map(([id,label])=>`<label class="check"><input name="${id}" type="checkbox"> ${label}</label>`).join('');}
function startCheck(){
 if(recentDue().length){toast('Revisa primero cómo respondió la rodilla a la sesión anterior.');follow(recentDue()[0].id);return;}
 openModal(`<span class="eyebrow">ANTES DE EMPEZAR</span><h2>¿Cómo está hoy?</h2><form id="screen"><label>Dolor actual: <output id="pain-value">0</output>/10<input type="range" name="pain" min="0" max="10" value="0"></label>${checkboxes()}<p class="fine">Si te indicaron inmovilización, no apoyar o limitar movimiento, pausa este plan hasta adaptarlo.</p><label class="check"><input name="compatible" type="checkbox" required> No tengo indicaciones médicas incompatibles con estos ejercicios.</label><button class="primary">Ver sesión recomendada</button></form>`);
 $('#screen input[name=pain]').oninput=e=>$('#pain-value').textContent=e.target.value;
 $('#screen').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),s={pain:Number(f.get('pain'))};for(const el of e.target.querySelectorAll('input[type=checkbox]'))s[el.name]=el.checked;const result=C.screen(s);closeModal();if(['urgent','stop'].includes(result.level)){openModal(`<span class="eyebrow">HOY TOCA CUIDAR</span><h2>Sesión suspendida</h2><p>${esc(result.text)}</p><button class="primary" id="return">Volver</button>`);$('#return').onclick=closeModal;return;}
 const recent=state.sessions.filter(x=>x.phase>=2&&x.place==='gym'&&!x.stopped).at(-1);
 const tooSoon=state.place==='gym'&&state.phase>=2&&recent&&(Date.now()-Date.parse(recent.started)<48*3600*1000);
 const gymDay=[2,4,6].includes(new Date(C.day()+'T12:00:00').getDay());
 const sameDayGym=state.sessions.some(x=>x.day===C.day()&&x.place==='gym'&&x.phase>=2&&!x.stopped);
 const effectivePhase=tooSoon?1:state.phase;
 const mobilityOnly=result.level==='adapt'||(state.phase>=2&&state.place==='home'&&(gymDay||sameDayGym));
 active={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),day:C.day(),started:new Date().toISOString(),phase:state.phase,place:state.place,pre:{...s,...result},items:C.routine(effectivePhase,state.place,mobilityOnly),index:0,skipped:mobilityOnly||tooSoon,stopped:false};
 if(tooSoon)toast('Aún no pasan 48 horas: hoy solo tren superior.');
 if(result.level==='adapt')toast(result.text);
 showExercise();};
}
function drawing(id){
 const lying=(leg='<path d="M122 144H247"/>',extra='')=>`<circle cx="58" cy="115" r="15"/><path d="M74 123l48 21"/>${leg}${extra}<path class="surface" d="M30 166H275"/>`;
 const seated=(arms='<path d="M128 87l38 8"/>',extra='')=>`<path class="equipment" d="M108 105v55h82M108 105h58"/><circle cx="128" cy="51" r="15"/><path d="M128 67v45l42 2 20 43M128 84l-26 29"/>${arms}${extra}<path class="surface" d="M72 160h170"/>`;
 const stand=(extra='')=>`<circle cx="140" cy="42" r="15"/><path d="M140 58v57m0-36l-34 34m34-34l36 29m-36 7l-24 45m24-45l28 45"/>${extra}<path class="surface" d="M78 161h130"/>`;
 let start='',end='',cue='Regresa lentamente al inicio; el control vale más que la amplitud.';
 if(id==='ankle'){
   start=lying('<path d="M122 144h112l18 13"/>');end=lying('<path d="M122 144h112l10-25"/>','<path class="arrow" d="M252 153q24-25 4-47"/>');cue='Solo se mueve el tobillo. La rodilla permanece relajada y apoyada.';
 }else if(id==='slide'){
   start=lying();end=lying('<path d="M122 144l70-58 49 58"/>','<path class="arrow" d="M250 139q-18-58-66-67"/>');cue='El talón nunca pierde contacto. Acércalo únicamente hasta donde se sienta cómodo.';
 }else if(id==='quad'){
   start=lying('<path d="M122 144h125"/>','<path class="towel" d="M152 150q18 13 36 0"/>');end=lying('<path d="M122 144h125"/>','<path class="target pulse" d="M148 130q22-17 44 0"/><path class="arrow" d="M170 106v27"/>');cue='Aprieta el muslo y lleva suavemente la rodilla hacia la cama, sin contener la respiración.';
 }else if(id==='raise'){
   start=lying();end=lying('<path class="moving" d="M122 144l121-55"/><path d="M122 144h121" class="ghost"/>','<path class="arrow" d="M234 139q10-35 2-58"/>');cue='La pierna sube como una sola pieza. Si la rodilla se dobla, omite el ejercicio.';
 }else if(id==='hip'){
   start=lying('<path d="M122 144h121"/><path d="M122 139h121"/>');end=lying('<path d="M122 144h121"/><path class="moving" d="M122 139l117-49"/>','<path class="arrow" d="M232 132q15-31 4-52"/>');cue='Pie mirando al frente y pelvis quieta. Sube la pierna de arriba sin rodar el tronco.';
 }else if(id==='seated'){
   start=seated('<path d="M128 87l35 22 24-15"/>','<path class="equipment" d="M201 55v95"/>');end=seated('<path class="moving" d="M128 87l50-4 22-28"/>','<path class="equipment" d="M201 55v95"/><path class="arrow" d="M180 112q23-20 24-47"/>');cue='Espalda apoyada. Empuja con los brazos sin ayudarte con las piernas.';
 }else if(id==='row'){
   start=seated('<path d="M128 87l54 8 28-1"/>','<path class="equipment" d="M216 48v112"/>');end=seated('<path class="moving" d="M128 87l34 12 23-3"/>','<path class="equipment" d="M216 48v112"/><path class="arrow" d="M204 78h-38"/>');cue='Lleva los codos hacia atrás sin balancear el tronco ni impulsarte con los pies.';
 }else if(id==='arms'){
   start=seated('<path d="M128 87l28 28 4 34"/>');end=seated('<path class="moving" d="M128 87l28 28 24-24"/>','<path class="arrow" d="M163 145q25-21 20-54"/>');cue='Codos pegados al cuerpo. Sube y baja las manos lentamente.';
 }else if(id==='bike'){
   start=seated('<path d="M128 87l28 8"/>','<circle class="equipment" cx="207" cy="137" r="29"/><path d="M170 114l37 23-18 22"/>');end=seated('<path d="M128 87l28 8"/>','<circle class="equipment" cx="207" cy="137" r="29"/><path class="moving" d="M170 114l37 23 25-16"/><path class="arrow" d="M181 117q27-29 54 1"/>');cue='Asiento alto y resistencia mínima. El pedaleo debe ser fluido y sin forzar la flexión.';
 }else if(id==='sit'){
   start=seated('<path d="M128 87l28 8"/>');end=stand('<path class="equipment ghost" d="M80 108v52h82M80 108h58"/><path class="arrow" d="M210 137q22-46-12-83"/>');cue='Inclina el tronco ligeramente, empuja el piso y evita que la rodilla caiga hacia dentro.';
 }else if(id==='calf'){
   start=stand('<path class="equipment" d="M93 55v106"/>');end=stand('<path class="equipment" d="M93 55v106"/><path class="heel moving" d="M109 160l21-10m30 10l20-10"/><path class="arrow" d="M205 150v-45"/>');cue='Sube ambos talones con apoyo de manos y baja lento; el tronco permanece vertical.';
 }else{start=stand();end=stand();}
 return `<figure class="movement-guide"><div class="visual-title"><span>1 · INICIO</span><b>Observa antes de moverte</b><span>2 · MOVIMIENTO</span></div><svg class="exercise-art" viewBox="0 0 680 230" role="img" aria-label="Secuencia visual del ejercicio: posición inicial y movimiento"><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z"/></marker></defs><g transform="translate(10 20)">${start}</g><path class="divider" d="M340 24v180"/><g transform="translate(350 20)">${end}</g><circle class="step-badge" cx="37" cy="36" r="17"/><text class="step-text" x="37" y="41">1</text><circle class="step-badge goal" cx="377" cy="36" r="17"/><text class="step-text" x="377" y="41">2</text></svg><figcaption><b>Clave visual:</b> ${esc(cue)}</figcaption></figure>`;
}
function showExercise(){
 clearInterval(interval);interval=null;const x=active.items[active.index];remaining=x.seconds;
 $('#view').innerHTML=`<section class="card workout"><div class="section-head"><span class="eyebrow">MISIÓN ${active.index+1} DE ${active.items.length} · ${active.place==='home'?'CASA':'GIMNASIO'}</span><button class="small danger-text" id="stop">Detener sesión</button></div><div class="progress-track"><span style="width:${100*active.index/active.items.length}%"></span></div><div class="workout-banner"><span class="bear-paw">●</span><span>CONTROL MONARCA</span><b>Calma · técnica · respiración</b></div><h1>${esc(x.name)}</h1><span class="pill dose-pill">${esc(x.dose)}</span>${drawing(x.id)}<div class="instruction-card"><span class="eyebrow">CÓMO HACERLO</span><p class="instruction">${esc(x.how)}</p></div><div class="notice warning"><b>Señal para detenerte</b><br>${esc(x.stop)}</div><div class="timer" id="time">${fmt(remaining)}</div><div class="actions center"><button class="small" id="timer-toggle">Iniciar tiempo</button><button class="small" id="restart">Reiniciar</button></div><p class="fine">Respira. Descansa cuando lo necesites. El tiempo no reemplaza las repeticiones.</p><button class="primary" id="next">${active.index===active.items.length-1?'Cerrar misión y registrar':'Movimiento completado →'}</button><button class="text" id="skip">Omitir si molesta o no está autorizado</button></section>`;
 $('#timer-toggle').onclick=toggleTimer;$('#restart').onclick=()=>{clearInterval(interval);interval=null;remaining=x.seconds;$('#time').textContent=fmt(remaining);$('#timer-toggle').textContent='Iniciar tiempo';};
 $('#next').onclick=()=>{if(active.index<active.items.length-1){active.index++;showExercise();}else finish(false);};
 $('#skip').onclick=()=>{active.skipped=true;$('#next').click();};$('#stop').onclick=()=>finish(true);
}
function fmt(n){return `${Math.floor(n/60).toString().padStart(2,'0')}:${(n%60).toString().padStart(2,'0')}`;}
function toggleTimer(){if(interval){clearInterval(interval);interval=null;$('#timer-toggle').textContent='Continuar';return;}if(remaining<=0)return;const end=Date.now()+remaining*1000;$('#timer-toggle').textContent='Pausar';interval=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));$('#time').textContent=fmt(remaining);if(!remaining){clearInterval(interval);interval=null;$('#timer-toggle').textContent='Tiempo cumplido';toast('Tiempo orientativo cumplido. Revisa técnica y repeticiones.');}},250);}
function finish(stopped){
 clearInterval(interval);interval=null;active.stopped=stopped;
 openModal(`<span class="eyebrow">${stopped?'EL OSO TAMBIÉN SABE CUÁNDO PARAR':'MISIÓN MONARCA COMPLETADA'}</span><h2>¿Cómo quedó la rodilla?</h2><p>La victoria de hoy es terminar igual o mejor de como comenzaste.</p><form id="post"><label>Dolor al terminar: <output id="post-value">${active.pre.pain}</output>/10<input type="range" name="pain" min="0" max="10" value="${active.pre.pain}"></label><label class="check"><input type="checkbox" name="swelling"> Aumentó la hinchazón</label><label class="check"><input type="checkbox" name="unstable"> Hubo bloqueo, falla o pinchazo</label><button class="primary">Guardar misión y descansar</button></form>`);
 $('#post input[name=pain]').oninput=e=>$('#post-value').textContent=e.target.value;
 $('#post').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);active.post={pain:Number(f.get('pain')),swelling:f.has('swelling'),unstable:f.has('unstable')};state.sessions.push(active);const bad=active.post.pain>2||active.post.swelling||active.post.unstable;active=null;save();closeModal();tab='progress';render();toast(bad?'El Monarca baja el paso: no aumentes carga y solicita valoración si persiste.':'Misión cumplida. La fuerza se construye con control; mañana registra cómo amaneciste.');};
}
function follow(id){const s=state.sessions.find(x=>x.id===id);if(!s)return;openModal(`<span class="eyebrow">RESPUESTA DE LAS 24 HORAS</span><h2>Después del ${esc(s.day)}</h2><p>Compara con cómo estabas antes de esa sesión. Si ya pasaron varios días, este registro tardío no confirma que la respuesta a las 24 horas fuera buena.</p><form id="follow"><label>Dolor hoy: <output id="follow-value">0</output>/10<input type="range" name="pain" min="0" max="10" value="0"></label><label class="check"><input type="checkbox" name="worse"> Más dolor, rigidez o cojera</label><label class="check"><input type="checkbox" name="swelling"> Hay hinchazón</label><label class="check"><input type="checkbox" name="unstable"> Hubo bloqueo o inestabilidad</label><button class="primary">Guardar respuesta</button></form>`);$('#follow input[name=pain]').oninput=e=>$('#follow-value').textContent=e.target.value;$('#follow').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const days=(Date.parse(C.day())-Date.parse(s.day))/86400000;s.next={day:C.day(),pain:Number(f.get('pain')),worse:f.has('worse')||days>1,swelling:f.has('swelling'),unstable:f.has('unstable')};save();closeModal();render();toast(s.next.worse||s.next.swelling||s.next.unstable||s.next.pain>2?'Mantén o reduce la dosis; revisa con tu tratante si persiste.':'Respuesta registrada. La constancia también se mide así.');};}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function wire(){
 const bind=(id,fn)=>{if($('#'+id))$('#'+id).onclick=fn;};
 bind('home',()=>{state.place='home';save();render();});bind('gym',()=>{state.place='gym';save();render();});bind('start',startCheck);bind('care-link',()=>nav('care'));bind('due',()=>follow(recentDue()[0].id));
 document.querySelectorAll('[data-follow]').forEach(b=>b.onclick=()=>follow(b.dataset.follow));
 bind('advance',()=>{if(!C.canAdvance(state).ok)return;openModal(`<h2>Confirmar etapa ${state.phase+1}</h2><p>La tolerancia registrada permite considerar el avance, pero no evalúa ligamentos, meniscos ni cartílago.</p><label class="check"><input type="checkbox" id="stage-approved"> Mi tratante autorizó específicamente los ejercicios de esta etapa.</label><button class="primary" id="confirm-stage" disabled>Avanzar un escalón</button>`);$('#stage-approved').onchange=e=>$('#confirm-stage').disabled=!e.target.checked;$('#confirm-stage').onclick=()=>{state.phase++;save();closeModal();render();toast('Nueva etapa. Aumenta una sola variable y vigila las 24 horas.');};});
 bind('back',()=>{state.phase=Math.max(0,state.phase-1);save();render();toast('Reducir la dosis es parte del plan.');});
 if($('#clinical'))$('#clinical').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.mriDate=f.get('mriDate');state.goal=f.get('goal')||blank().goal;state.notes=f.get('notes');state.clearance={reviewed:f.has('reviewed'),approved:f.has('approved'),date:C.day()};if(!state.clearance.reviewed||!state.clearance.approved)state.phase=0;save();render();toast('Indicaciones guardadas. El avance se revisa en Progreso.');};
 bind('export',()=>download(`Rodilla05-registro-${C.day()}.json`,JSON.stringify(state,null,2),'application/json'));
 bind('import',()=>$('#import-file').click());if($('#import-file'))$('#import-file').onchange=async e=>{try{const file=e.target.files[0];if(!file||file.size>2e6)throw Error();const incoming=JSON.parse(await file.text());if(incoming.version!==1||!Array.isArray(incoming.sessions)||incoming.sessions.length>5000||![0,1,2,3].includes(incoming.phase)||typeof incoming.mriDate!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(incoming.mriDate)||incoming.sessions.some(s=>![0,1,2,3].includes(s.phase)||typeof s.id!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.day)||!Number.isFinite(Date.parse(s.started))||!['home','gym'].includes(s.place)||!s.pre||!s.post||!Number.isFinite(s.post.pain)||s.post.pain<0||s.post.pain>10||(s.next&&(!Number.isFinite(s.next.pain)||s.next.pain<0||s.next.pain>10))))throw Error();openModal('<h2>Restaurar copia</h2><p>Esta copia reemplazará el registro actual de este navegador. Exporta primero si quieres conservarlo.</p><button class="primary" id="restore">Restaurar</button>');$('#restore').onclick=()=>{state={...blank(),...incoming};if(!state.clearance?.approved||!state.clearance?.reviewed)state.phase=0;save();closeModal();render();toast('Copia restaurada.');};}catch(err){toast('No se pudo restaurar: el archivo no es una copia válida.');}};
 bind('install',async()=>{if(installEvent){installEvent.prompt();await installEvent.userChoice;installEvent=null;}else openModal('<h2>Llévala a tu pantalla de inicio</h2><p>En iPhone o iPad: abre el enlace en Safari, toca Compartir y selecciona “Añadir a pantalla de inicio”. En Android: menú del navegador → Instalar aplicación o Añadir a pantalla de inicio.</p><p>Necesitas abrir la versión alojada por HTTPS. Después de la primera carga podrá funcionar sin conexión.</p>');});
 bind('calendar',()=>{const date=C.day().replaceAll('-','');download('Rodilla05-0500.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Rodilla05//ES\r\nBEGIN:VEVENT\r\nUID:rodilla05-0500@personal\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}\r\nDTSTART:${date}T050000\r\nDTEND:${date}T051500\r\nRRULE:FREQ=DAILY\r\nSUMMARY:Rodilla 05 - revisar y cuidar\r\nDESCRIPTION:Revisar sintomas antes de ejercitar. Pausar si hay alertas.\r\nBEGIN:VALARM\r\nTRIGGER:PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:Tu cita contigo\r\nEND:VALARM\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`,'text/calendar');toast('Importa el archivo en tu calendario. La hora es local.');});
 bind('reset',()=>{openModal('<h2>Borrar este registro</h2><p>Se eliminará la bitácora de este navegador. Exporta una copia antes si quieres conservarla.</p><button class="primary" id="delete-confirm">Borrar definitivamente</button>');$('#delete-confirm').onclick=()=>{state=blank();save();closeModal();render();toast('Registro reiniciado.');};});
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>nav(b.dataset.tab));
$('#close-modal').onclick=closeModal;
$('#modal').addEventListener('cancel',e=>{if(active){e.preventDefault();toast('Guarda el registro final para cerrar la sesión.');}});
$('#close-modal').addEventListener('click',()=>{if(active&&!$('#modal').open)showExercise();});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;});
if('serviceWorker'in navigator&&['https:','http:'].includes(location.protocol))navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
window.addEventListener('beforeunload',e=>{if(active){e.preventDefault();e.returnValue='';}});
render();
</script></body></html>
