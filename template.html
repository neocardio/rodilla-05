nk:0}.check{display:flex;align-items:flex-start;gap:10px;color:var(--text);font-size:13px}.check input{margin-top:3px}ul{padding-left:20px;color:var(--muted);font-size:14px}li{margin:12px 0}.source-links{display:flex;flex-direction:column;gap:12px;font-size:13px}a{color:var(--mint);text-underline-offset:4px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.danger-text{color:var(--amber)}nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#0c1523f0;border-top:1px solid var(--line);backdrop-filter:blur(18px);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px}nav button{width:130px;border-radius:12px;background:transparent;color:var(--muted);font-size:11px;padding:8px}nav button b{display:block;font-size:19px;font-weight:400;line-height:1.2;margin-bottom:5px}nav button.selected{background:#203b37;color:var(--mint)}footer{max-width:1100px;margin:0 auto 110px;font-size:10px;color:var(--muted);padding:0 30px}dialog{color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:520px;width:calc(100% - 32px);max-height:90dvh;overflow:auto}dialog::backdrop{background:#030915c9;backdrop-filter:blur(5px)}.close-row{text-align:right}#close-modal{border-radius:50%;width:32px;height:32px;padding:0;color:var(--muted);background:#27364a;font-size:20px}.workout{max-width:760px;margin:12px auto;text-align:center}.workout h1{font-size:40px;letter-spacing:-1.5px}.instruction{font-size:17px;margin:22px auto;max-width:560px}.exercise-art{width:100%;max-width:350px;height:180px;stroke:var(--mint);stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}.exercise-art .surface{stroke:var(--line);stroke-width:3}.exercise-art .ghost{stroke:var(--muted);opacity:.25;stroke-dasharray:6 6}.pulse{stroke:var(--lav);stroke-width:2;animation:pulse 2s infinite}.moving{transform-origin:130px 85px;animation:move 3s infinite alternate}.timer{font-size:66px;color:var(--mint);font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-3px;margin-top:10px}.center{justify-content:center}.progress-track{height:4px;background:var(--line);border-radius:6px;margin-top:20px;overflow:hidden}.progress-track span{display:block;height:100%;background:var(--mint)}#toast{position:fixed;bottom:100px;left:50%;transform:translate(-50%,15px);width:max-content;max-width:calc(100% - 30px);background:#30483f;color:#edf9f2;border:1px solid #568775;border-radius:14px;padding:14px 20px;z-index:100;font-size:13px;opacity:0;pointer-events:none;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}@keyframes pulse{50%{opacity:.3}}@keyframes move{to{transform:rotate(8deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(max-width:700px){header{padding:20px}.stage{font-size:8px;max-width:165px}main{padding:15px 20px 100px}.hero{grid-template-columns:1fr;padding:18px 0 30px}.hero-art{display:none}h1{font-size:43px;letter-spacing:-2px}.dashboard{grid-template-columns:1fr;gap:16px}.card{padding:22px;border-radius:18px}.quote h2{font-size:24px}.phase-grid{grid-template-columns:1fr}.page-heading h1{font-size:39px}.mini-stats{gap:25px}.log{align-items:flex-start;flex-wrap:wrap}.week{gap:4px}.week span{font-size:8px}.week div{padding:10px 2px}nav{gap:3px;padding-left:8px;padding-right:8px}nav button{width:25%;max-width:120px}.workout h1{font-size:32px}.instruction{font-size:15px}.section-head{flex-wrap:wrap}.brand{font-size:18px}.metric{margin-top:20px}}
